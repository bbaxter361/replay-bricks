# Main Replay Bricks website and Spring API
[build]
  command = "cd website && npm ci --include=dev && npm run build"
  publish = "website/dist"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "website/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "mammoth", "xlsx"]

[functions.spring]
  timeout = 60
  memory = 2048

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/spring"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

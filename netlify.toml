# Main Replay Bricks website
[build]
  base = "website"
  publish = "dist"
  command = "npm run build"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Netlify Functions — directory set via API build settings to repo-root relative
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "mammoth", "xlsx"]

# API — route all /api/* through Spring function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/spring"
  status = 200

# SPA fallback — everything else goes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

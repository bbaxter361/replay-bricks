# Main Replay Bricks website and Spring API
[build]
  command = "cd website && npm ci && npm run build && cp -r ../clutch/dist dist/hold"
  publish = "website/dist"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "website/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "mammoth", "xlsx", "@netlify/blobs", "serverless-http", "express", "cors", "@netlify/functions", "oauth-1.0a", "multer"]

[functions.spring]
  timeout = 90
  memory = 2048
  external_node_modules = ["pdf-parse", "mammoth", "xlsx", "@netlify/blobs", "serverless-http", "express", "cors", "@netlify/functions", "oauth-1.0a", "multer"]
  node_bundler = "esbuild"
  included_files = ["website/node_modules/pdfjs-dist/build/pdf.worker.mjs", "website/node_modules/pdfjs-dist/cmaps/**"]

[functions.clutch]
  timeout = 120
  memory = 1024

[functions."clutch-scheduled"]
  schedule = "*/15 * * * *"

# ── Security Headers ──
[[headers]]
  for = "/clutch/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://replaybricksv2.netlify.app https://api.deepseek.com https://api.openai.com https://api.canva.com https://api.bricklink.com https://api.brickowl.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── API redirects ──
# Clutch inventory app — redirect /inventory to /clutch/
[[redirects]]
  from = "/inventory"
  to = "/clutch/"
  status = 301

# Clutch inventory API (more specific — must come BEFORE Spring catch-all)
[[redirects]]
  from = "/api/clutch/*"
  to = "/.netlify/functions/clutch/:splat"
  status = 200

[[redirects]]
  from = "/api/inventory/*"
  to = "/.netlify/functions/clutch/:splat"
  status = 200

[[redirects]]
  from = "/api/orders/*"
  to = "/.netlify/functions/clutch/:splat"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/clutch"
  status = 200

# Clutch API (legacy hold path — must come BEFORE Spring catch-all)
[[redirects]]
  from = "/api/hold/*"
  to = "/.netlify/functions/clutch/:splat"
  status = 200

# Spring API (Compass/chat — catches all other /api/*)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/spring"
  status = 200

# Clutch SPA — serve the inventory app at /clutch
[[redirects]]
  from = "/clutch/*"
  to = "/clutch/index.html"
  status = 200
[[redirects]]
  from = "/clutch"
  to = "/clutch/index.html"
  status = 200
[[redirects]]
  from = "/clutch/"
  to = "/clutch/index.html"
  status = 200

# Main site SPA catch-all (keep LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Main Replay Bricks website
[build]
  command = "cd website && npm run build"
  publish = "website/dist"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Netlify Functions
[functions]
  node_bundler = "esbuild"
  directory = "website/netlify/functions"
  external_node_modules = ["pdf-parse", "mammoth", "xlsx"]
  included_files = ["website/node_modules/pdfjs-dist/build/pdf.worker.mjs", "website/node_modules/pdfjs-dist/cmaps/**"]

# Spring function specific settings
[functions.spring]
  timeout = 60
  memory = 2048

# API — route all /api/* through Spring function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/spring"
  status = 200

# SPA fallback — everything else goes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

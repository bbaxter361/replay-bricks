# Main Replay Bricks website and Spring API
[build]
  command = "cd website && npm ci --include=dev && npm run build"
  publish = "website/dist"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "website/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "mammoth", "xlsx", "@netlify/blobs"]

[functions.spring]
  timeout = 60
  memory = 2048

# ── Security Headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://replaybricksv2.netlify.app https://api.deepseek.com https://api.openai.com https://api.canva.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/spring"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

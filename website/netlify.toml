[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/hold/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/spring"
  status = 200

[[redirects]]
  from = "/hold/*"
  to = "/hold/index.html"
  status = 200

[[redirects]]
  from = "/hold"
  to = "/hold/index.html"
  status = 200

[[redirects]]
  from = "/hold/"
  to = "/hold/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

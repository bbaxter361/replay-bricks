# fly.toml app configuration file generated for replaybricks-api on 2026-05-07T21:21:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'replaybricks-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat API Test</title>
</head>
<body>
    <h1>Chat API Test</h1>
    <div>
        <textarea id="message" placeholder="Enter test message" rows="4" cols="50"></textarea><br>
        <button onclick="testAPI()">Test API</button>
    </div>
    <div>
        <h3>Response:</h3>
        <div id="response" style="border: 1px solid #ccc; padding: 10px; margin: 10px 0; min-height: 100px;"></div>
    </div>
    
    <script>
        async function testAPI() {
            const message = document.getElementById('message').value || 'Hello, test message';
            const responseDiv = document.getElementById('response');
            
            responseDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch('https://replaybricksv2.netlify.app/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': 'spring-vicki-2026'
                    },
                    body: JSON.stringify({
                        message: message,
                        history: []
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                responseDiv.innerHTML = `
                    <strong>Status:</strong> ${response.status}<br>
                    <strong>Response:</strong><br>
                    <pre style="white-space: pre-wrap; font-family: Arial;">${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                responseDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="compass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90A2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8CB08C;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="45" stroke="url(#compass-grad)" stroke-width="4" fill="#FFF8F0"/>
  <!-- Compass arrow - north -->
  <polygon points="50,15 44,38 50,35 56,38" fill="#D4A855"/>
  <!-- Compass arrow - south -->
  <polygon points="50,85 44,62 50,65 56,62" fill="#4A90A2"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#D4A855"/>
  <!-- Cardinal marks -->
  <line x1="50" y1="10" x2="50" y2="20" stroke="#4A90A2" stroke-width="2"/>
  <line x1="50" y1="80" x2="50" y2="90" stroke="#4A90A2" stroke-width="2"/>
  <line x1="10" y1="50" x2="20" y2="50" stroke="#4A90A2" stroke-width="2"/>
  <line x1="80" y1="50" x2="90" y2="50" stroke="#4A90A2" stroke-width="2"/>
  <!-- N S E W labels -->
  <text x="50" y="7" text-anchor="middle" font-size="8" font-weight="bold" fill="#4A90A2" font-family="Inter">N</text>
  <text x="50" y="95" text-anchor="middle" font-size="8" font-weight="bold" fill="#4A90A2" font-family="Inter">S</text>
  <text x="6" y="52" text-anchor="middle" font-size="7" font-weight="bold" fill="#4A90A2" font-family="Inter">W</text>
  <text x="94" y="52" text-anchor="middle" font-size="7" font-weight="bold" fill="#4A90A2" font-family="Inter">E</text>
</svg>

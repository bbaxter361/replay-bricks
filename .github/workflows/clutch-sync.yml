name: Hold Sync (15min)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:  # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hold sync + check for new orders
        run: |
          TOKEN=$(curl -s -X POST https://replaybrick.com/api/clutch/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"brian@replaybrick.com","password":"'"$HOLD_PASSWORD"'"}' \
            | jq -r '.token')
          
          RESULT=$(curl -s -X POST "https://replaybrick.com/api/clutch/scheduler/tick" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 120)
          
          echo "Sync result: $RESULT"
          
          NEW=$(echo "$RESULT" | jq -r '.results.new_orders // 0')
          echo "New orders: $NEW"
          
          if [ "$NEW" -gt 0 ]; then
            echo "::notice::${NEW} new order(s) found"
            echo "$RESULT" | jq -r '.results.order_ids[]' | while read oid; do
              echo "  - $oid"
            done
          fi
    env:
      HOLD_PASSWORD: ${{ secrets.HOLD_PASSWORD }}
